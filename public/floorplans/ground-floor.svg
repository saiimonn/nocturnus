<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#0b1220"/>
  <g fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round">
    <!-- outer shell -->
    <rect x="60" y="60" width="1080" height="680" rx="8"/>
    <rect x="80" y="80" width="1040" height="640" rx="4" stroke-width="1.5" opacity="0.5"/>
    <!-- stage, upper centre -->
    <path d="M420 80 L420 190 Q600 250 780 190 L780 80"/>
    <path d="M470 110 L470 165 Q600 205 730 165 L730 110" stroke-width="1.5" opacity="0.6"/>
    <!-- dancefloor -->
    <rect x="400" y="290" width="400" height="300" stroke-dasharray="14 10"/>
    <!-- bar, left wall -->
    <path d="M80 300 L250 300 L250 560 L80 560"/>
    <path d="M110 330 L220 330 L220 530 L110 530" stroke-width="1.5" opacity="0.6"/>
    <!-- booths, right wall -->
    <g stroke-width="2">
      <rect x="950" y="240" width="170" height="90"/>
      <rect x="950" y="350" width="170" height="90"/>
      <rect x="950" y="460" width="170" height="90"/>
      <rect x="950" y="570" width="170" height="90"/>
    </g>
    <!-- entrance -->
    <path d="M540 740 L540 700 M660 740 L660 700"/>
    <path d="M540 700 A60 60 0 0 0 660 700" stroke-width="1.5" opacity="0.6"/>
  </g>
  <g fill="#7dd3fc" font-family="monospace" font-size="16" opacity="0.4">
    <text x="80" y="40">GROUND FLOOR — PLAN VIEW</text>
    <text x="1120" y="40" text-anchor="end">SCALE 1:100</text>
  </g>
</svg>
