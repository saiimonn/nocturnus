<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#0b1220"/>
  <g fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round">
    <!-- outer shell -->
    <rect x="60" y="60" width="1080" height="680" rx="8"/>
    <!-- balcony void looking down over the main floor -->
    <path d="M300 740 L300 420 Q600 300 900 420 L900 740" stroke-dasharray="14 10"/>
    <path d="M340 740 L340 445 Q600 340 860 445 L860 740" stroke-width="1.5" opacity="0.5"/>
    <!-- vip tables ringing the void -->
    <g stroke-width="2">
      <circle cx="200" cy="260" r="46"/>
      <circle cx="340" cy="190" r="46"/>
      <circle cx="490" cy="150" r="46"/>
      <circle cx="650" cy="150" r="46"/>
      <circle cx="810" cy="190" r="46"/>
      <circle cx="960" cy="260" r="46"/>
    </g>
    <!-- service bar, left -->
    <path d="M60 420 L210 420 L210 600 L60 600"/>
    <!-- stairs, right -->
    <g stroke-width="2">
      <rect x="990" y="430" width="150" height="240"/>
      <path d="M990 470 L1140 470 M990 510 L1140 510 M990 550 L1140 550 M990 590 L1140 590 M990 630 L1140 630" stroke-width="1.5" opacity="0.6"/>
    </g>
  </g>
  <g fill="#7dd3fc" font-family="monospace" font-size="16" opacity="0.4">
    <text x="80" y="40">VIP MEZZANINE — PLAN VIEW</text>
    <text x="1120" y="40" text-anchor="end">SCALE 1:100</text>
  </g>
</svg>
